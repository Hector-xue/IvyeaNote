[package]
name = "tauri-plugin-ivnote-launcher"
version = "0.1.0"
description = "安卓桌面入口：长按图标快捷方式 + 笔记卡片 / 快捷创建小部件"
edition = "2021"
# tauri-plugin 的 build 脚本硬性要求：links 必须存在且与 package.name 一致（同 ivnote-saf）
links = "tauri-plugin-ivnote-launcher"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
