[package]
name = "tauri-plugin-ivnote-saf"
version = "0.1.0"
description = "安卓 Storage Access Framework：让笔记库能落在用户自己选的系统目录里"
edition = "2021"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
