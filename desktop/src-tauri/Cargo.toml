[package]
name = "ivyea-note-desktop"
version = "0.1.0"
description = "Ivyea Note 桌面端：本地 Markdown · 多端同步"
authors = ["ivyea"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
