# Ivyea Note 质量门禁：push / PR 时跑 lint + 类型检查 + 单元测试，任一不过即红。
# v0.3.3 起：阶段 0（P0 急救）防回归基建 —— hooks 违例、prompt 复活、门控复发都会被挡住。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: 固定 Node 22 LTS（Node 20 缺 util.markAsUncloneable，jsdom/undici 会崩；Node 24 曾触发 npm bug）
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      # v0.7.2：Rust 编译门禁（v0.7.0/0.7.1 的 discover.rs E0308 曾漏到 release 才炸）
      - name: 安装 Linux 编译依赖（cargo check 需要 GTK/webkit 头文件）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust 编译门禁（cargo check）
        working-directory: desktop/src-tauri
        run: cargo check 2>/dev/null || cargo check

      - name: Lint（oxlint：含 react-hooks 规则，rules-of-hooks 违例即 error）
        run: npx oxlint src

      - name: 类型检查（tsc -b）
        run: npx tsc -b

      - name: 单元测试（vitest）
        run: npx vitest run

      - name: 前端构建（vite build）
        run: npx vite build
