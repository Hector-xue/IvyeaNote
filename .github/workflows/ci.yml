# Ivyea Note 质量门禁：push / PR 时跑 lint + 类型检查 + 单元测试，任一不过即红。
# v0.3.3 起：阶段 0（P0 急救）防回归基建 —— hooks 违例、prompt 复活、门控复发都会被挡住。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: 固定 Node 22 LTS（Node 20 缺 util.markAsUncloneable，jsdom/undici 会崩；Node 24 曾触发 npm bug）
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      # v0.7.2：Rust 编译门禁（v0.7.0/0.7.1 的 discover.rs E0308 曾漏到 release 才炸）
      - name: 安装 Linux 编译依赖（cargo check 需要 GTK/webkit 头文件）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust 编译门禁（cargo check）
        working-directory: desktop/src-tauri
        run: cargo check

      - name: Lint（oxlint：含 react-hooks 规则，rules-of-hooks 违例即 error）
        run: npx oxlint src

      - name: 类型检查（tsc -b）
        run: npx tsc -b

      - name: 单元测试（vitest）
        run: npx vitest run

      - name: 前端构建（vite build）
        run: npx vite build

      # v0.10.4：**开源产物里不许出现任何硬编码的同步服务器域名**。
      # v0.10.3 把作者自己的 note.ivyea.com 写死成了所有构建的默认值，于是公开
      # Release 的每个安装包，登录页底下都挂着别人的私有服务器地址——而且是发版
      # 之后才被用户发现的。单测只能守住 defaultServerUrl() 的返回值，守不住
      # "有人换个地方又写死一次"，所以直接扫产物。
      # 私有构建（自己传 VITE_DEFAULT_SERVER）不受影响：那种情况下这一步不该跑，
      # 而 CI 从不设这个变量。
      - name: 产物不得内置同步服务器域名
        run: |
          if [ -n "${VITE_DEFAULT_SERVER:-}" ]; then
            echo "设置了 VITE_DEFAULT_SERVER，跳过（私有构建）"; exit 0
          fi
          hits=$(grep -rhoE '(https?://)?[a-z0-9-]+\.(ivyea|example)\.[a-z]{2,}' dist/assets/*.js 2>/dev/null \
                 | grep -v 'example\.com' | sort -u || true)
          if [ -n "$hits" ]; then
            echo "::error::构建产物里出现了硬编码域名——开源安装包不该指向任何人的私有服务器："
            echo "$hits"
            exit 1
          fi
          echo "产物干净：没有内置任何同步服务器域名" 
