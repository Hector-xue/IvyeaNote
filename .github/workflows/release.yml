# Ivyea Note 桌面端自动打包：push 标签 v* 时，三平台并行构建并挂到 GitHub Release
# 前提：本目录推送到 GitHub 仓库（Actions 默认开启）。产物：dmg / msi / deb / AppImage
name: release

on:
  push:
    tags: ['v*']

# 允许 GITHUB_TOKEN 创建 Release 并上传安装包（新仓库默认只读）
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
          - os: ubuntu-22.04
            args: ''
          - os: windows-latest
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 稳定工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # v0.7.2：Rust 门禁前先装好系统依赖（cargo check 需要 GTK/webkit 头文件）
      - name: Linux 编译依赖（webkit2gtk 等）
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # v0.7.2：Rust 编译门禁 —— 打包前先 cargo check，类型错误几分钟内暴露
      # （v0.7.0/0.7.1 的 discover.rs E0308 就是漏到这里才炸的）
      - name: Rust 编译门禁（cargo check）
        working-directory: desktop/src-tauri
        run: cargo check 2>/dev/null || cargo check

      - name: 固定 Node 22 LTS（Node 20 缺 util.markAsUncloneable，jsdom/undici 会崩；Node 24 曾触发 npm bug）
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 前端构建（桌面模式）
        working-directory: desktop
        # 用 npm install 而非 npm ci：lockfile 在 Linux 上生成，缺少 mac/win 的
        # rolldown 原生绑定(optional deps)，各平台需自行补齐
        run: npm install --no-audit --no-fund && npm run build

      # v0.3.3 质量门禁：任一不过不出包（与 ci.yml 同一套检查，防止坏代码流进安装包）
      - name: 质量门禁（lint + 类型 + 单元测试）
        working-directory: desktop
        run: npx oxlint src && npx tsc -b && npx vitest run

      - name: Tauri 打包并发布 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # v0.7.2：应用内更新 —— updater 产物（.sig 签名 + latest.json）必需
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: 'Ivyea Note ${{ github.ref_name }}'
          releaseBody: '桌面安装包：Windows 用 .msi/.exe，macOS 用 .dmg（Apple Silicon 选 aarch64），Linux 用 .deb/.AppImage'
          releaseDraft: false
          prerelease: false

  # 服务端 Docker 镜像：推 ghcr.io，供用户「拉官方镜像」部署（无需本地构建源码）
  docker-image:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送服务端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/hector-xue/ivyeanote/ivnote-server:latest
            ghcr.io/hector-xue/ivyeanote/ivnote-server:${{ github.ref_name }}

      # 部署包：只含 deploy 目录（不含源码），给「装在自己电脑」的用户用
      - name: 打包部署包
        run: |
          cd deploy
          zip -r ../IvyeaNote-deploy.zip . -x "./.env" -x "./IvyeaNote-账号.txt"

      - name: 上传部署包到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: IvyeaNote-deploy.zip

  # Android APK：Tauri 2 Mobile 构建（aarch64 真机为主 + 模拟器包），挂到同一 Release
  android-apk:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 稳定工具链（Android 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: 安装 Java 17 + Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 固定 Node 22 LTS（Node 20 缺 util.markAsUncloneable，jsdom/undici 会崩；Node 24 曾触发 npm bug）
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 前端构建
        working-directory: desktop
        run: npm install --no-audit --no-fund && npm run build

      - name: 安装 tauri-cli 并初始化 Android 工程
        working-directory: desktop
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri android init

      # v0.3.4：注入品牌图标。android init 生成的是 Tauri 默认黄蓝双环图标
      # （v0.3.3 真机反馈：手机上不是 Ivyea 的藤蔓 logo），用仓库内图标集覆盖。
      - name: 注入 Android 品牌图标
        working-directory: desktop
        run: cp -r src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/

      # 版本号写入 Android 工程（与 tag 同步）
      - name: 构建通用 APK（含 arm64/armv7/x86/x86_64）
        working-directory: desktop
        run: |
          sudo apt-get update && sudo apt-get install -y gradle
          unset NDK_HOME
          cargo tauri android build --apk --split-per-abi
          mkdir -p apk-out
          find src-tauri/gen/android -name "*.apk" -exec cp {} apk-out/ \;
          ls -la apk-out

      # 自签名：CI 临时生成 keystore 给 release APK 签名（未签名包安卓报「解析软件包失败」）
      - name: 签名 APK（自签 keystore）
        working-directory: desktop/apk-out
        run: |
          set -euo pipefail
          KS="/tmp/ivnote-release.keystore"
          KP="ivnote-android"
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -v -keystore "$KS" -alias ivnote \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass "$KP" -keypass "$KP" \
              -dname "CN=Ivyea Note, OU=Ivyea, O=Ivyea, C=CN"
          fi
          # 定位 build-tools：按 ANDROID_HOME → ANDROID_SDK_ROOT → 默认 SDK 路径解析，
          # 取 zipalign 所在目录的最新版本；全落空则 sdkmanager 兜底安装 34.0.0。
          # （旧写法 `ZIPS=$(ls ...*/zipalign)` 在 glob 未命中时 ls 返回 exit 2，
          #   直接把整个步骤打挂且无任何可读报错——v0.3.1 run#18 的失败即此。）
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT=""
          hit="$(ls -d "$SDK_ROOT"/build-tools/*/zipalign 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$hit" ]; then BT="$(dirname "$hit")"; fi
          if [ -z "$BT" ]; then
            echo "::warning::未找到已装 build-tools，尝试 sdkmanager 安装 34.0.0"
            # yes|sdkmanager 在 pipefail 下可能因 yes 收到 SIGPIPE(141) 误判失败，
            # 这里只告警不中止，真正放行与否由下面的可执行位硬校验决定
            (yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" > /dev/null) \
              || echo "::warning::sdkmanager 非零退出，继续校验工具是否已可用"
            BT="$SDK_ROOT/build-tools/34.0.0"
          fi
          if [ ! -x "$BT/zipalign" ] || [ ! -x "$BT/apksigner" ]; then
            echo "::error::build-tools 缺少 zipalign/apksigner：$BT"
            exit 1
          fi
          echo "使用 build-tools: $BT"
          for f in *.apk; do
            [ -e "$f" ] || continue
            # zipalign 必需 <align> 参数（4 = 32 位对齐）；漏写在 v0.3.3 run#20 打印 usage 后 exit 2
            "$BT/zipalign" -f -p 4 "$f" "$f.aligned"
            "$BT/apksigner" sign --ks "$KS" --ks-key-alias ivnote \
              --ks-pass "pass:$KP" --key-pass "pass:$KP" \
              --out "$f.signed" "$f.aligned"
            mv "$f.signed" "$f"
            rm -f "$f.aligned"
          done
          ls -la

      - name: 重命名产物
        working-directory: desktop/apk-out
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for f in *.apk; do
            abi=$(echo "$f" | grep -oE 'arm64|armv7|x86_64|i686|universal' || echo universal)
            mv "$f" "Ivyea.Note_${VERSION}_${abi}.apk"
          done
          ls -la

      - name: 上传 APK 到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/apk-out/*.apk

# 说明：latest.json（应用内更新清单）由 tauri-action 在 build 矩阵里自动生成并上传到
# Release —— 开启 createUpdaterArtifacts + 提供 TAURI_SIGNING_PRIVATE_KEY 即可，
# 无需单独的 manifest job。updater endpoint 指向
# releases/latest/download/latest.json，各平台任务上传的内容相同、后传者覆盖，无碍。
