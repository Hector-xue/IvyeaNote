# Ivyea Note 桌面端自动打包：push 标签 v* 时，三平台并行构建并挂到 GitHub Release
# 前提：本目录推送到 GitHub 仓库（Actions 默认开启）。产物：dmg / msi / deb / AppImage
name: release

on:
  push:
    tags: ['v*']

# 允许 GITHUB_TOKEN 创建 Release 并上传安装包（新仓库默认只读）
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # triple/go_os/go_arch 是给 sidecar 用的：Tauri 按 `<name>-<target-triple>` 找二进制。
        # macOS 两支是**交叉目标**，必须按 target 编而不是按 host——照 host 编出来的是
        # 另一个架构，打包时 Tauri 找不到对应后缀的文件直接失败。
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
            triple: aarch64-apple-darwin
            go_os: darwin
            go_arch: arm64
          - os: macos-latest
            args: --target x86_64-apple-darwin
            triple: x86_64-apple-darwin
            go_os: darwin
            go_arch: amd64
          - os: ubuntu-22.04
            args: ''
            triple: x86_64-unknown-linux-gnu
            go_os: linux
            go_arch: amd64
          - os: windows-latest
            args: ''
            triple: x86_64-pc-windows-msvc
            go_os: windows
            go_arch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 稳定工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # v0.7.2：Rust 门禁前先装好系统依赖（cargo check 需要 GTK/webkit 头文件）
      - name: Linux 编译依赖（webkit2gtk 等）
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # v0.10.5：把同步服务端作为 sidecar 编进安装包。
      # 用户群体大多是「一台 Windows + 一部安卓」，此前这个组合要同步得先自己搭服务器；
      # 而服务端默认 SQLite、密钥与管理员账号全自动生成，本来就该跟着客户端一起发。
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum

      # 要为**两个** triple 各编一份：
      #   - matrix.triple：`tauri build --target …` 真正打包用的那个
      #   - host triple：`cargo check` **不带 --target**，所以它按 host 校验 externalBin
      # macos-latest 是 Apple Silicon（host=aarch64-apple-darwin），而 x86_64 那一支
      # 的 matrix.triple 是 x86_64-apple-darwin —— 只编 matrix 的那份，cargo check
      # 就会报 `binaries/ivnote-server-aarch64-apple-darwin doesn't exist`（实测踩到）。
      # Go 交叉编译几乎不花时间，多编一份比在这里绕弯子便宜。
      - name: 编译同步服务端 sidecar
        shell: bash
        working-directory: server
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p ../desktop/src-tauri/binaries
          build_for() {
            local triple="$1" os arch ext=""
            case "$triple" in
              x86_64-pc-windows-msvc)    os=windows arch=amd64 ext=.exe ;;
              aarch64-pc-windows-msvc)   os=windows arch=arm64 ext=.exe ;;
              aarch64-apple-darwin)      os=darwin  arch=arm64 ;;
              x86_64-apple-darwin)       os=darwin  arch=amd64 ;;
              x86_64-unknown-linux-gnu)  os=linux   arch=amd64 ;;
              aarch64-unknown-linux-gnu) os=linux   arch=arm64 ;;
              *) echo "::error::不认识的 target triple: $triple"; return 1 ;;
            esac
            local out="../desktop/src-tauri/binaries/ivnote-server-$triple$ext"
            echo "→ $triple ($os/$arch)"
            GOOS=$os GOARCH=$arch go build -ldflags="-s -w" -o "$out" ./cmd/ivnote-server
          }
          build_for "${{ matrix.triple }}"
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          if [ -n "$HOST" ] && [ "$HOST" != "${{ matrix.triple }}" ]; then
            echo "host($HOST) 与 target 不同，为 cargo check 再编一份"
            build_for "$HOST"
          fi
          ls -la ../desktop/src-tauri/binaries/

      # v0.7.2：Rust 编译门禁 —— 打包前先 cargo check，类型错误几分钟内暴露
      - name: Rust 编译门禁（cargo check）
        working-directory: desktop/src-tauri
        run: cargo check

      - name: 固定 Node 22 LTS（Node 20 缺 util.markAsUncloneable，jsdom/undici 会崩；Node 24 曾触发 npm bug）
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 前端构建（桌面模式）
        working-directory: desktop
        # 用 npm install 而非 npm ci：lockfile 在 Linux 上生成，缺少 mac/win 的
        # rolldown 原生绑定(optional deps)，各平台需自行补齐
        run: npm install --no-audit --no-fund && npm run build

      # v0.3.3 质量门禁：任一不过不出包（与 ci.yml 同一套检查，防止坏代码流进安装包）
      - name: 质量门禁（lint + 类型 + 单元测试）
        working-directory: desktop
        run: npx oxlint src && npx tsc -b && npx vitest run

      # v0.10.5：**打包线也要设防**。这道扫描此前只在 ci.yml 里有，而 v0.10.3 把作者
      # 自己的域名写死进产物、一路发到公开 Release 上，正是「打包这条线没人查」才发生的。
      # 门禁挡的是 PR，发版走的是另一条路——两条都得有。
      - name: 产物不得内置同步服务器域名
        working-directory: desktop
        shell: bash
        run: |
          if [ -n "${VITE_DEFAULT_SERVER:-}" ]; then
            echo "设置了 VITE_DEFAULT_SERVER，跳过（私有构建）"; exit 0
          fi
          hits=$(grep -rhoE '(https?://)?[a-z0-9-]+\.(ivyea|example)\.[a-z]{2,}' dist/assets/*.js 2>/dev/null \
                 | grep -v 'example\.com' | sort -u || true)
          if [ -n "$hits" ]; then
            echo "::error::构建产物里出现了硬编码域名——开源安装包不该指向任何人的私有服务器："
            echo "$hits"
            exit 1
          fi
          echo "产物干净：没有内置任何同步服务器域名"

      - name: Tauri 打包并发布 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # v0.7.2：应用内更新 —— updater 产物（.sig 签名 + latest.json）必需
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: 'Ivyea Note ${{ github.ref_name }}'
          releaseBody: |
            桌面安装包：Windows 用 `-setup.exe`，macOS 用 `.dmg`（Apple Silicon 选 aarch64，Intel 选 x64），Linux 用 `.deb` 或 `.AppImage`。
            安卓装 `Ivyea.Note_<版本>_universal.apk` 一个就够（含全部 CPU 架构）。
            `.app.tar.gz` 是 macOS 应用内更新用的，手动安装请忽略。

            想自己搭同步服务器：下 `ivnote-server-<系统>-<架构>`，它是**单个可执行文件**，
            默认用 SQLite、自动生成密钥和管理员账号，**不需要 Docker、不需要数据库**。
            Windows 用户把它和 `IvyeaNote-deploy.zip` 里的 `ivnote-win-setup.ps1` 放一起，
            重命名成 `ivnote-server.exe` 后双击那个 ps1 即可。
          releaseDraft: false
          prerelease: false

  # 服务端 Docker 镜像：推 ghcr.io，供用户「拉官方镜像」部署（无需本地构建源码）
  docker-image:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送服务端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/hector-xue/ivyeanote/ivnote-server:latest
            ghcr.io/hector-xue/ivyeanote/ivnote-server:${{ github.ref_name }}

      # 部署包：只含 deploy 目录（不含源码），给「装在自己电脑」的用户用
      - name: 打包部署包
        run: |
          cd deploy
          zip -r ../IvyeaNote-deploy.zip . -x "./.env" -x "./IvyeaNote-账号.txt"

      - name: 上传部署包到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: IvyeaNote-deploy.zip

  # 服务端独立二进制：让「不想碰 Docker 的人」能直接双击跑起来。
  #
  # 这条一直是断的：deploy/ivnote-win-setup.ps1（免 Docker 向导）从 v0.7.0 起就写着
  # 「请先从 GitHub Release 下载 ivnote-server-windows-amd64.exe」——而这个文件
  # **从来没有出现在任何一个 Release 里**。向导本身是好的，只是它依赖的东西没人发。
  #
  # 服务端默认后端就是 SQLite（IVNOTE_DB 默认 sqlite），密钥和管理员账号都会自动生成，
  # 所以它真的就是「一个 exe 跑起来就完事」，Docker 是自找的。
  # modernc 的 sqlite 是纯 Go 实现，CGO_ENABLED=0 直接交叉编译即可。
  server-binaries:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum

      - name: 交叉编译服务端
        working-directory: server
        run: |
          set -euo pipefail
          mkdir -p ../server-out
          build() {
            local os=$1 arch=$2 ext=${3:-}
            echo "→ $os/$arch"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -ldflags="-s -w" \
              -o "../server-out/ivnote-server-$os-$arch$ext" ./cmd/ivnote-server
          }
          build windows amd64 .exe
          build windows arm64 .exe
          build darwin  amd64
          build darwin  arm64
          build linux   amd64
          build linux   arm64
          ls -la ../server-out

      - name: 上传服务端二进制到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: server-out/*

  # Android APK：Tauri 2 Mobile 构建（aarch64 真机为主 + 模拟器包），挂到同一 Release
  android-apk:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 稳定工具链（Android 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: 安装 Java 17 + Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 固定 Node 22 LTS（Node 20 缺 util.markAsUncloneable，jsdom/undici 会崩；Node 24 曾触发 npm bug）
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 前端构建
        working-directory: desktop
        run: npm install --no-audit --no-fund && npm run build

      - name: 安装 tauri-cli 并初始化 Android 工程
        working-directory: desktop
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri android init

      # v0.3.4：注入品牌图标。android init 生成的是 Tauri 默认黄蓝双环图标
      # （v0.3.3 真机反馈：手机上不是 Ivyea 的藤蔓 logo），用仓库内图标集覆盖。
      - name: 注入 Android 品牌图标
        working-directory: desktop
        run: cp -r src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/

      # 版本号写入 Android 工程（与 tag 同步）
      # v0.10.2：只出**一个**通用 APK。此前 --split-per-abi 会额外产出 arm64 / x86_64
      # 两个分包，Release 里三个 APK 摆在一起，用户第一件事是猜自己该下哪个——
      # 而通用包只比分包大 1~2 MB，这点体积换不来那份犹豫。
      - name: 构建通用 APK（含 arm64/armv7/x86/x86_64）
        working-directory: desktop
        run: |
          sudo apt-get update && sudo apt-get install -y gradle
          unset NDK_HOME
          cargo tauri android build --apk
          mkdir -p apk-out
          find src-tauri/gen/android -name "*universal*.apk" -exec cp {} apk-out/ \;
          # 兜底：某些 tauri-cli 版本产物不带 universal 字样
          if [ -z "$(ls -A apk-out)" ]; then
            find src-tauri/gen/android -name "*.apk" -exec cp {} apk-out/ \;
          fi
          ls -la apk-out

      # ⚠️ 安卓的升级校验看的是**签名证书**：证书一换，系统就认为是另一个应用，
      # 只报「应用未安装 / 签名不一致」，用户必须先卸载——而卸载会连同
      # 内部存储里的笔记一起删掉。
      #
      # v0.10.2 之前这里是 `if [ ! -f /tmp/ivnote-release.keystore ]` 再 keytool 现生成。
      # CI runner 每次都是全新的机器，那个条件**永远成立**，于是每发一个版本就换一把
      # 新钥匙，每次更新都得卸载重装。这不是偶发问题，是必然。
      #
      # 现在密钥来自仓库 Secret，**一次生成、永久使用**。缺 Secret 就直接失败：
      # 宁可不出包，也不能再出一个签名对不上的包。
      - name: 签名 APK（固定发布密钥）
        working-directory: desktop/apk-out
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_B64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD Secret。"
            echo "::error::没有固定签名密钥就只能现生成一把，那会让所有老用户升级时报「签名不一致」。"
            echo "::error::生成与配置方法见 docs/安卓签名密钥.md"
            exit 1
          fi
          KS="$RUNNER_TEMP/ivnote-release.keystore"
          KP="$ANDROID_KEYSTORE_PASSWORD"
          ALIAS="${ANDROID_KEY_ALIAS:-ivnote}"
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$KS"
          # 校验密码/别名对不对——错了要在这里报，而不是产出一个签不上名的包
          keytool -list -keystore "$KS" -storepass "$KP" -alias "$ALIAS" > /dev/null
          # 定位 build-tools：按 ANDROID_HOME → ANDROID_SDK_ROOT → 默认 SDK 路径解析，
          # 取 zipalign 所在目录的最新版本；全落空则 sdkmanager 兜底安装 34.0.0。
          # （旧写法 `ZIPS=$(ls ...*/zipalign)` 在 glob 未命中时 ls 返回 exit 2，
          #   直接把整个步骤打挂且无任何可读报错——v0.3.1 run#18 的失败即此。）
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT=""
          hit="$(ls -d "$SDK_ROOT"/build-tools/*/zipalign 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$hit" ]; then BT="$(dirname "$hit")"; fi
          if [ -z "$BT" ]; then
            echo "::warning::未找到已装 build-tools，尝试 sdkmanager 安装 34.0.0"
            # yes|sdkmanager 在 pipefail 下可能因 yes 收到 SIGPIPE(141) 误判失败，
            # 这里只告警不中止，真正放行与否由下面的可执行位硬校验决定
            (yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" > /dev/null) \
              || echo "::warning::sdkmanager 非零退出，继续校验工具是否已可用"
            BT="$SDK_ROOT/build-tools/34.0.0"
          fi
          if [ ! -x "$BT/zipalign" ] || [ ! -x "$BT/apksigner" ]; then
            echo "::error::build-tools 缺少 zipalign/apksigner：$BT"
            exit 1
          fi
          echo "使用 build-tools: $BT"
          for f in *.apk; do
            [ -e "$f" ] || continue
            # zipalign 必需 <align> 参数（4 = 32 位对齐）；漏写在 v0.3.3 run#20 打印 usage 后 exit 2
            "$BT/zipalign" -f -p 4 "$f" "$f.aligned"
            "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$KP" --key-pass "pass:$KP" \
              --out "$f.signed" "$f.aligned"
            mv "$f.signed" "$f"
            rm -f "$f.aligned"
          done
          # 把证书指纹打进日志：以后再有人报「签名不一致」，
          # 对一下各版本的 SHA-256 就知道是不是又换钥匙了
          for f in *.apk; do
            echo "== $f"
            "$BT/apksigner" verify --print-certs "$f" | grep -i "SHA-256" || true
          done
          rm -f "$KS"
          ls -la

      - name: 重命名产物
        working-directory: desktop/apk-out
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for f in *.apk; do
            abi=$(echo "$f" | grep -oE 'arm64|armv7|x86_64|i686|universal' || echo universal)
            mv "$f" "Ivyea.Note_${VERSION}_${abi}.apk"
          done
          ls -la

      - name: 上传 APK 到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/apk-out/*.apk

  # 收尾：删掉 Release 上纯冗余的 .sig 资产。
  # 应用内更新读的是 latest.json，签名以字符串形式**内联**在里面（platforms.*.signature），
  # 这些 .sig 文件没有任何消费方，只是让下载页多出一半的条目。
  # 必须等三个出包 job 都结束再删，否则会把后到的那批漏下。
  tidy-release:
    needs: [build, docker-image, android-apk, server-binaries]
    if: always()
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 移除 .sig 资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ids=$(gh api "repos/$REPO/releases/tags/$TAG" \
            --jq '.assets[] | select(.name | endswith(".sig")) | "\(.id) \(.name)"')
          if [ -z "$ids" ]; then echo "没有 .sig 资产，跳过"; exit 0; fi
          echo "$ids" | while read -r id name; do
            echo "删除 $name"
            gh api -X DELETE "repos/$REPO/releases/assets/$id"
          done

# 说明：latest.json（应用内更新清单）由 tauri-action 在 build 矩阵里自动生成并上传到
# Release —— 开启 createUpdaterArtifacts + 提供 TAURI_SIGNING_PRIVATE_KEY 即可，
# 无需单独的 manifest job。updater endpoint 指向
# releases/latest/download/latest.json，各平台任务上传的内容相同、后传者覆盖，无碍。
